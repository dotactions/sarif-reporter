name: Test Security Report

on:
  pull_request:
    paths:
      - "src/**"
      - "dist/**"
      - "action.yml"
      - "tests/fixtures/*.sarif"
      - ".github/workflows/internal-test.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "dist/**"
      - "action.yml"
      - "tests/fixtures/*.sarif"
      - ".github/workflows/internal-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-security-report-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-security-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run security-report with clean fixture
        id: report-clean
        uses: ./
        with:
          title: "Clean Security Report"
          sarif-file: "tests/fixtures/clean.sarif"
          comment-tag: "test-clean"
          fail-on-findings: "true"

      - name: Assert clean outputs
        shell: bash
        env:
          TOTAL: ${{ steps.report-clean.outputs.total-findings }}
          REPORT_FILE: ${{ steps.report-clean.outputs.report-file }}
        run: |
          if [ "$TOTAL" -ne 0 ]; then
            echo "Expected 0 findings, got $TOTAL"
            exit 1
          fi
          grep -q "Passed ✅" "$REPORT_FILE"

      - name: Run security-report with dirty fixture
        id: report-dirty
        uses: ./
        with:
          title: "Dirty Security Report"
          sarif-file: "tests/fixtures/dirty.sarif"
          comment-tag: "test-report"
          fail-on-findings: "false"

      - name: Assert dirty outputs
        shell: bash
        env:
          TOTAL: ${{ steps.report-dirty.outputs.total-findings }}
          REPORT_FILE: ${{ steps.report-dirty.outputs.report-file }}
        run: |
          if [ "$TOTAL" -ne 2 ]; then
            echo "Expected 2 findings, got $TOTAL"
            exit 1
          fi
          test -f "$REPORT_FILE"

      - name: Run security-report with an invalid post-comment value
        id: report-invalid-comment
        continue-on-error: true
        uses: ./
        with:
          sarif-file: "tests/fixtures/dirty.sarif"
          comment-tag: "test-invalid-comment"
          post-comment: "no"

      - name: Assert invalid post-comment is rejected
        shell: bash
        env:
          OUTCOME: ${{ steps.report-invalid-comment.outcome }}
        run: '[ "$OUTCOME" = failure ] || { echo "Expected failure, got $OUTCOME"; exit 1; }'

      - name: Run security-report with post-comment disabled
        id: report-no-comment
        uses: ./
        with:
          sarif-file: "tests/fixtures/dirty.sarif"
          comment-tag: "test-no-comment"
          post-comment: "false"

      - name: Assert summary is still produced without a comment
        shell: bash
        env:
          TOTAL: ${{ steps.report-no-comment.outputs.total-findings }}
          REPORT_FILE: ${{ steps.report-no-comment.outputs.report-file }}
        run: |
          [ "$TOTAL" -eq 2 ] || { echo "Expected 2 findings, got $TOTAL"; exit 1; }
          test -f "$REPORT_FILE"

      # The job has no issues: write, so if the default-branch guard fails to skip, the API 403 fails this step.
      - name: Run security-report with manage-issue on a PR
        id: report-guard
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          sarif-file: "tests/fixtures/dirty.sarif"
          comment-tag: "test-guard"
          manage-issue: "true"
